app_name: Cierge
app_version: 1.0.0
app_port: 8000
cors_origins:
  - http://localhost:5173

qdrant:
  url: http://qdrant:6333
  api_key: null
  collection_name: crs_data
  vector_size: 1024

postgres:
  enabled: false
  url: postgresql://user:password@localhost:5432/crs

debug: false

graph_max_input_characters_per_message: 16000
main_loop_max_iterations: 5
orchestrator_agent_max_iterations: 5

orchestrator_model:
  model: gemini_flash
  fallback: mistral_small
  temperature: 0.7
  max_tokens: 2048
  top_p: 0.95
  reasoning_effort: null

ask_model:
  model: gemini_flash_lite
  fallback: mistral_small
  temperature: 0.7
  max_tokens: 2048
  top_p: 0.95
  reasoning_effort: null

recommend_model:
  model: gemini_flash_lite
  fallback: mistral_small
  temperature: 0.7
  max_tokens: 2048
  top_p: 0.95
  reasoning_effort: null

search_min_score_threshold: 0.40

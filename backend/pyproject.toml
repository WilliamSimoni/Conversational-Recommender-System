requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crs_agent"
version = "1.0.0"
description = "Backend Conversational Recommender System Agent"
readme = "README.md"
requires-python = ">=3.13"
authors =[
    { name = "William Simoni" }
]
dependencies =[
    "fastapi==0.136.1",
    "uvicorn[standard]==0.47.0",
    "pydantic==2.13.4",
    "langchain==1.3.1",
    "langchain-openai==1.2.2",
    "langchain-core==1.4.0",
    "langgraph==1.2.1",
    "PyYAML==6.0.3",
    "pydantic-settings==2.14.1",
    "python-dotenv",
    "qdrant-client==1.18.0",
    "tenacity==9.1.4",
    "langgraph-checkpoint-postgres==3.1.0",
    "psycopg[binary,pool]==3.3.4",
]

[project.optional-dependencies]
dev =[
    "pytest",
    "ruff",
    "mypy",
    "pre-commit"
]

eval = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["src"]
include =["crs_agent*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = [
    "src",
]
testpaths = [
    "tests",
]
